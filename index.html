<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oui</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <span class="logo">Oui</span>
    <nav>
      <a href="#apropos">À propos</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Bienvenue sur Oui</h1>
      <p>Un nouveau projet, prêt à grandir.</p>
      <button id="cta" type="button">Dire oui</button>
      <p id="compteur" aria-live="polite"></p>
    </section>

    <section id="apropos">
      <h2>À propos</h2>
      <p>Décrivez ici votre projet : son objectif, son public et ses fonctionnalités.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Ajoutez ici vos coordonnées.</p>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="annee"></span> Oui</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
